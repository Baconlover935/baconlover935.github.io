               }
           });
       }

       function onPlayerComplete(e){
           if( e.success ){
               finalize(e.player);
           }
           else {
               console.log("Whoops! Something went wrong building the player: " + e.message);
           }
       }

       function finalize(playerInstance){
           playlist = new org.pbskids.video.PlayList(
                   "now-playing-list",
                   "playlistItem",
                   playerInstance,
                   {
                       debugMode: true,
                       loadingIndicator      : "https://web.archive.org/web/20161016002113/http://www-tc.pbskids.org/video/img/arrowspin.gif",

                       loadMoreButtonClass   : "showmore-videos",
                       previousVideoControl  : "#controlrack .previous",
                       nextVideoControl      : "#controlrack .next"
                   }
           );
           playlist.refresh();
           $('#playlist-wrapper').fadeIn();
       }

       $(document).ready(function() {
           if(!swfobject.getFlashPlayerVersion().release) {
               init();
